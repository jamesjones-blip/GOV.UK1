{% extends "base.html" %}

{% block content %}
<main role="main" id="content" class="govuk-main-wrapper">
    <div class="govuk-grid-row">
        <div class="govuk-grid-column-full">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <h1 class="govuk-heading-xl">Admin Dashboard</h1>
                <a href="/logout" class="govuk-link">Logout</a>
            </div>

            <button class="govuk-button" id="show-add-form">Add New Record</button>

            <!-- Add/Edit Form (Hidden by default) -->
            <div id="form-container" class="govuk-!-display-none" style="background-color: #f3f2f1; padding: 20px; margin-bottom: 30px; border: 1px solid #b1b4b6;">
                <h2 class="govuk-heading-l" id="form-title">Add New Record</h2>
                <form id="record-form" enctype="multipart/form-data">
                    <input type="hidden" id="record-id">
                    <div class="govuk-grid-row">
                        <div class="govuk-grid-column-one-half">
                            <div class="govuk-form-group">
                                <label class="govuk-label" for="registration_number">Registration Number</label>
                                <input class="govuk-input" id="registration_number" name="registration_number" type="text">
                            </div>
                            <div class="govuk-form-group">
                                <label class="govuk-label" for="licence_number">Licence Number</label>
                                <input class="govuk-input" id="licence_number" name="licence_number" type="text">
                            </div>
                            <div class="govuk-form-group">
                                <label class="govuk-label" for="full_name">Full Name</label>
                                <input class="govuk-input" id="full_name" name="full_name" type="text">
                            </div>
                            <div class="govuk-form-group">
                                <label class="govuk-label" for="address">Address</label>
                                <textarea class="govuk-textarea" id="address" name="address" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="govuk-grid-column-one-half">
                            <div class="govuk-form-group">
                                <label class="govuk-label" for="dob">Date of Birth</label>
                                <input class="govuk-input" id="dob" name="dob" type="text" placeholder="DD/MM/YYYY">
                            </div>
                            <div class="govuk-form-group">
                                <label class="govuk-label" for="licence_type">Licence Type</label>
                                <input class="govuk-input" id="licence_type" name="licence_type" type="text" placeholder="Full / Provisional">
                            </div>
                            <div class="govuk-form-group">
                                <label class="govuk-label" for="valid_until">Valid Until</label>
                                <input class="govuk-input" id="valid_until" name="valid_until" type="text" placeholder="DD/MM/YYYY">
                            </div>
                            <div class="govuk-form-group">
                                <label class="govuk-label" for="vehicle_categories">Vehicle Categories</label>
                                <input class="govuk-input" id="vehicle_categories" name="vehicle_categories" type="text" placeholder="A, B, f, k, q">
                            </div>
                            <div class="govuk-form-group">
                                <label class="govuk-label" for="endorsements">Endorsements</label>
                                <input class="govuk-input" id="endorsements" name="endorsements" type="text" placeholder="None / SP30 (3 pts)">
                            </div>
                        </div>
                    </div>
                    
                    <div class="govuk-form-group">
                        <label class="govuk-label" for="document">Upload Document (Soft Copy)</label>
                        <input class="govuk-file-upload" id="document" name="document" type="file">
                    </div>

                    <div class="govuk-button-group">
                        <button class="govuk-button" type="submit" id="save-btn">Save Record</button>
                        <button class="govuk-button govuk-button--secondary" type="button" id="cancel-btn">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Search -->
            <div class="govuk-form-group">
                <label class="govuk-label" for="admin-search">
                    Search Records
                </label>
                <input class="govuk-input govuk-!-width-one-half" id="admin-search" type="text" placeholder="Filter by name or number...">
            </div>

            <!-- Records Table -->
            <table class="govuk-table">
                <thead class="govuk-table__head">
                    <tr class="govuk-table__row">
                        <th class="govuk-table__header">Name</th>
                        <th class="govuk-table__header">Reg / Licence</th>
                        <th class="govuk-table__header">Type</th>
                        <th class="govuk-table__header">Valid Until</th>
                        <th class="govuk-table__header">Actions</th>
                    </tr>
                </thead>
                <tbody class="govuk-table__body" id="records-table-body">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const tableBody = document.getElementById('records-table-body');
    const showAddFormBtn = document.getElementById('show-add-form');
    const formContainer = document.getElementById('form-container');
    const recordForm = document.getElementById('record-form');
    const cancelBtn = document.getElementById('cancel-btn');
    const searchInput = document.getElementById('admin-search');
    let allRecords = [];

    function loadRecords() {
        fetch('/api/records')
            .then(res => res.json())
            .then(data => {
                allRecords = data;
                renderRecords(data);
            });
    }

    function renderRecords(records) {
        tableBody.innerHTML = '';
        records.forEach(rec => {
            const row = document.createElement('tr');
            row.className = 'govuk-table__row';
            row.innerHTML = `
                <td class="govuk-table__cell">${rec.full_name}</td>
                <td class="govuk-table__cell">${rec.registration_number || '-'}<br><small>${rec.licence_number}</small></td>
                <td class="govuk-table__cell">${rec.licence_type}</td>
                <td class="govuk-table__cell">${rec.valid_until}</td>
                <td class="govuk-table__cell">
                    <a href="#" class="govuk-link edit-link" data-id="${rec.id}">Edit</a> |
                    <a href="#" class="govuk-link delete-link" data-id="${rec.id}" style="color: #d4351c;">Delete</a>
                </td>
            `;
            tableBody.appendChild(row);
        });

        // Add event listeners for edit and delete
        document.querySelectorAll('.edit-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const id = this.dataset.id;
                const record = allRecords.find(r => r.id == id);
                showEditForm(record);
            });
        });

        document.querySelectorAll('.delete-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                if (confirm('Are you sure you want to delete this record?')) {
                    const id = this.dataset.id;
                    deleteRecord(id);
                }
            });
        });
    }

    function deleteRecord(id) {
        fetch(`/api/records/${id}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(() => loadRecords());
    }

    showAddFormBtn.addEventListener('click', () => {
        document.getElementById('form-title').textContent = 'Add New Record';
        recordForm.reset();
        document.getElementById('record-id').value = '';
        formContainer.classList.remove('govuk-!-display-none');
    });

    cancelBtn.addEventListener('click', () => {
        formContainer.classList.add('govuk-!-display-none');
    });

    function showEditForm(record) {
        document.getElementById('form-title').textContent = 'Edit Record';
        document.getElementById('record-id').value = record.id;
        document.getElementById('registration_number').value = record.registration_number;
        document.getElementById('licence_number').value = record.licence_number;
        document.getElementById('full_name').value = record.full_name;
        document.getElementById('address').value = record.address;
        document.getElementById('dob').value = record.dob;
        document.getElementById('licence_type').value = record.licence_type;
        document.getElementById('valid_until').value = record.valid_until;
        document.getElementById('vehicle_categories').value = record.vehicle_categories;
        document.getElementById('endorsements').value = record.endorsements;
        
        formContainer.classList.remove('govuk-!-display-none');
        window.scrollTo(0, 0);
    }

    recordForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('record-id').value;
        const formData = new FormData(this);
        
        const url = id ? `/api/records/${id}` : '/api/records';
        const method = 'POST'; // We use POST for both (Flask handles id in URL for update)

        fetch(url, {
            method: method,
            body: formData
        })
        .then(res => res.json())
        .then(() => {
            formContainer.classList.add('govuk-!-display-none');
            loadRecords();
        });
    });

    searchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase();
        const filtered = allRecords.filter(rec => 
            rec.full_name.toLowerCase().includes(query) || 
            rec.licence_number.toLowerCase().includes(query) ||
            (rec.registration_number && rec.registration_number.toLowerCase().includes(query))
        );
        renderRecords(filtered);
    });

    loadRecords();
});
</script>
{% endblock %}
